plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

// The Anthropic API key and base URL are supplied at build time rather than
// being written into the source tree. A key baked into the APK can be
// extracted by anyone who downloads it, so a production build should point
// ANTHROPIC_BASE_URL at a proxy (a Firebase Cloud Function, for example)
// that holds the key server-side and leave the key itself empty.
def anthropicApiKey = localProperties.getProperty("farmos.anthropicApiKey")
        ?: project.findProperty("farmos.anthropicApiKey")
        ?: System.getenv("ANTHROPIC_API_KEY")
        ?: ""
def anthropicBaseUrl = localProperties.getProperty("farmos.anthropicBaseUrl")
        ?: project.findProperty("farmos.anthropicBaseUrl")
        ?: System.getenv("ANTHROPIC_BASE_URL")
        ?: ""
def geminiApiKey = localProperties.getProperty("farmos.geminiApiKey")
        ?: localProperties.getProperty("GEMINI_API_KEY")
        ?: project.findProperty("farmos.geminiApiKey")
        ?: System.getenv("GEMINI_API_KEY")
        ?: ""

android {
    namespace "com.samuel.farmos"
    compileSdk 35

    defaultConfig {
        applicationId 'com.samuel.farmos'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "ANTHROPIC_API_KEY", "\"${anthropicApiKey}\""
        buildConfigField "String", "ANTHROPIC_BASE_URL", "\"${anthropicBaseUrl}\""
        buildConfigField "String", "GEMINI_API_KEY", "\"${geminiApiKey}\""
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"385857701045-u45j8pc5d1boc7iekn5n9allq2oqughg.apps.googleusercontent.com\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // The Anthropic SDK uses java.time (Duration, Clock, OffsetDateTime),
        // which only exists from API 26. The app supports API 24, so the
        // library is desugared down to the older platform.
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            // Several jars pulled in transitively (httpclient5, httpcore5, ...)
            // each ship a META-INF/DEPENDENCIES file, which makes the resource
            // merger fail with "N files found with path 'META-INF/DEPENDENCIES'".
            // That file is only build metadata, so dropping it is safe.
            excludes += [
                    "META-INF/DEPENDENCIES",
                    "META-INF/LICENSE",
                    "META-INF/LICENSE.txt",
                    "META-INF/NOTICE",
                    "META-INF/NOTICE.txt"
            ]
        }
    }

    lint {
        abortOnError false
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    // AndroidX Core & Lifecycle
    implementation 'androidx.core:core-ktx:1.13.1'
    // The platform splash screen API (Android 12+ shows a system splash automatically;
    // this backports it to older releases so launch looks the same on every device).
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.activity:activity-compose:1.9.3'

    // Credentials / Auth
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    // Jetpack Compose BOM & UI
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    implementation 'androidx.compose.material3:material3'
    // The full Material icon set. `material-icons-core` only ships a handful of
    // icons, and the screens here use the standard ones (Pets, Visibility, ...).
    implementation 'androidx.compose.material:material-icons-extended'

    // Navigation Compose
    implementation 'androidx.navigation:navigation-compose:2.8.3'

    // Firebase BOM & Services
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-appcheck-debug'
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'

    // Play Services Auth
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    // CameraX
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'

    // Coroutines & Guava
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1'
    implementation 'com.google.guava:guava:33.2.1-android'

    // The Anthropic SDK powers the AI Farm Assistant.
    implementation 'com.anthropic:anthropic-java:2.34.0'

    // Rewrites java.time (and the rest of the java.* APIs that arrived after
    // API 21) so they work on the older Android versions this app supports.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
